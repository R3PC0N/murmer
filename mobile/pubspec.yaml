name: murmer_mobile
description: Murmer voice dictation for Android — remote Whisper transcription with floating overlay.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Floating overlay over other apps
  flutter_overlay_window: ^0.5.0

  # Audio recording
  record: ^5.0.4

  # HTTP for Whisper server calls
  http: ^1.2.1

  # Persistent settings storage
  shared_preferences: ^2.2.3

  # Runtime permissions (mic, overlay)
  permission_handler: ^11.3.1

  # Temp file paths for audio
  path_provider: ^2.1.3

  # Generate IDs for servers and profiles
  uuid: ^4.4.2

dependency_overrides:
  # record_linux 0.7.2 doesn't implement record_platform_interface 1.5.0 — force the newer version
  record_linux: ^1.3.0

  # Use local patched version of flutter_overlay_window.
  # Our patches add:
  #   - Null intent fix (START_STICKY on service restart)
  #   - com.murmer/clipboard MethodChannel (copyText + pasteText via AccessibilityService)
  flutter_overlay_window:
    path: local_packages/flutter_overlay_window

flutter:
  uses-material-design: true
