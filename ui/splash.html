<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murmur</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1c1c1e;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .logo-icon {
    width: 40px;
    height: 40px;
  }

  .logo-text {
    font-size: 30px;
    font-weight: 700;
    color: rgba(255,255,255,0.92);
    letter-spacing: -0.02em;
  }

  .subtitle {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 28px;
    letter-spacing: 0.01em;
  }

  .bar-track {
    width: 220px;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 99px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    width: 40%;
    background: #C8922A;
    border-radius: 99px;
    animation: slide 1.4s ease-in-out infinite;
  }

  @keyframes slide {
    0%   { transform: translateX(-100%); }
    50%  { transform: translateX(150%); }
    100% { transform: translateX(350%); }
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <svg class="logo-icon" viewBox="0 0 256 256" fill="none">
      <rect x="8" y="8" width="240" height="240" rx="46" ry="46" fill="#232326"/>
      <rect x="25" y="105" width="20" height="46" rx="10" fill="#C8922A"/>
      <rect x="56" y="87" width="20" height="82" rx="10" fill="#C8922A"/>
      <rect x="87" y="69" width="20" height="119" rx="10" fill="#C8922A"/>
      <rect x="118" y="50" width="20" height="156" rx="10" fill="#C8922A"/>
      <rect x="149" y="69" width="20" height="119" rx="10" fill="#C8922A"/>
      <rect x="180" y="87" width="20" height="82" rx="10" fill="#C8922A"/>
      <rect x="211" y="105" width="20" height="46" rx="10" fill="#C8922A"/>
    </svg>
    <span class="logo-text">Murmur</span>
  </div>
  <div class="subtitle" id="status">Loading speech model...</div>
  <div class="bar-track">
    <div class="bar-fill"></div>
  </div>
</div>
<script>
  if (window.pywebview) {
    window.pywebview.api.get_status().then(s => {
      if (s) document.getElementById('status').textContent = s;
    });
  }
</script>
</body>
</html>
